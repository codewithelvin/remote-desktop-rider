# nginx front end for rider-server's HTTPS tunnel: the fallback for networks
# that block UDP (company firewalls). TLS ends here; the WebSocket goes on to
# rider-server's `--tunnel-listen 127.0.0.1:47900` on the same machine.
#
# Replace rider.example.com with your server's name (the one hosts and clients
# use in set-server), then:
#
#   sudo cp nginx-rider-tunnel.conf /etc/nginx/sites-available/rider-tunnel
#   sudo ln -s /etc/nginx/sites-available/rider-tunnel /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d rider.example.com     # adds the certificate lines
#   sudo nginx -t && sudo systemctl reload nginx
#
# Peers check the certificate against the system's trusted roots, so it must be
# a real one (e.g. Let's Encrypt). Open TCP 443 (and 80 for certbot).

server {
    listen 80;
    listen [::]:80;
    server_name rider.example.com;

    location /rider-tunnel {
        proxy_pass http://127.0.0.1:47900;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        # Tunnels stay open as long as a host is online.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
