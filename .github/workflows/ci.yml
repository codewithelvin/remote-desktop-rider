name: ci
on:
  push:
    paths-ignore: ["**.md", "docs/**", ".claude/**", "site/**", ".github/workflows/pages.yml"]
  pull_request:

# One release at a time, so version numbers never collide.
concurrency: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'release' || github.run_id }}

env:
  RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

jobs:
  # Every push to main is released as the next patch version of the
  # major.minor in Cargo.toml (bump that by hand for bigger steps).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the next version number
      - id: v
        shell: pwsh
        run: |
          $base = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+)\.(\d+)\.(\d+)"' | Select-Object -First 1).Matches[0].Groups
          $mm = "$($base[1].Value).$($base[2].Value)"
          $last = git tag --list "v$mm.*" | ForEach-Object { [int]($_ -replace "^v$([regex]::Escape($mm))\.", '') } | Sort-Object | Select-Object -Last 1
          $version = if ($null -eq $last) { "$mm.$($base[3].Value)" } else { "$mm.$($last + 1)" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

  # The rendezvous/relay server, for Linux (x86_64). Built on the oldest
  # supported Ubuntu so the binary runs on any current distribution.
  server:
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        if: env.RELEASE == 'true'
        run: sed -i "0,/^version = \"[^\"]*\"/s//version = \"$VERSION\"/" Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p rider-core -p rider-server --all-targets -- -D warnings
      - run: cargo test -p rider-core -p rider-server
      - run: cargo build --release -p rider-server
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/rider-server dist/rider-server-$VERSION-linux-x86_64
          strip dist/rider-server-$VERSION-linux-x86_64
          ./dist/rider-server-$VERSION-linux-x86_64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: rider-server-linux
          path: dist/
          retention-days: 7

  # macOS groundwork (docs/MACOS.md): the portable crates must keep building
  # and passing their tests on macOS. Does not gate releases.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p rider-core -p rider-server --all-targets -- -D warnings
      - run: cargo test -p rider-core -p rider-server

  build:
    needs: [version, server]
    runs-on: windows-latest
    permissions:
      contents: write # tags and releases
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        if: env.RELEASE == 'true'
        shell: pwsh
        run: (Get-Content Cargo.toml) -replace '^version = "[^"]+"', "version = `"$env:VERSION`"" | Set-Content Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

      - name: Installer
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          ./packaging/windows/build.ps1 -Version $env:VERSION

      - uses: actions/download-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: rider-server-linux
          path: dist

      - name: Publish release
        if: env.RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "target/installer/rdr-setup-$env:VERSION.exe"
          $server = "dist/rider-server-$env:VERSION-linux-x86_64"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $shash = (Get-FileHash $server -Algorithm SHA256).Hash.ToLower()
          # sha256sum format, checked by deploy/get.sh (the one-line server install).
          "$hash  rdr-setup-$env:VERSION.exe`n$shash  rider-server-$env:VERSION-linux-x86_64`n" | Set-Content -NoNewline -Encoding ascii dist/SHA256SUMS
          $notes = "Download **rdr-setup-$env:VERSION.exe** below and run it (Windows 10/11, 64-bit).`n`nSHA-256: ``$hash```n`nServer (Linux x86_64): **rider-server-$env:VERSION-linux-x86_64**, SHA-256: ``$shash``"
          gh release create "v$env:VERSION" $setup $server dist/SHA256SUMS --target $env:GITHUB_SHA --title "Remote Desktop Rider $env:VERSION" --notes "$notes" --generate-notes --latest
