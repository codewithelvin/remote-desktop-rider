name: ci
on:
  push:
    paths-ignore: ["**.md", "docs/**", ".claude/**", "site/**", ".github/workflows/pages.yml"]
  pull_request:

# One release at a time, so version numbers never collide.
concurrency: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'release' || github.run_id }}

env:
  RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

jobs:
  # Every push to main is released as the next patch version of the
  # major.minor in Cargo.toml (bump that by hand for bigger steps).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the next version number
      - id: v
        shell: pwsh
        run: |
          $base = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+)\.(\d+)\.(\d+)"' | Select-Object -First 1).Matches[0].Groups
          $mm = "$($base[1].Value).$($base[2].Value)"
          $last = git tag --list "v$mm.*" | ForEach-Object { [int]($_ -replace "^v$([regex]::Escape($mm))\.", '') } | Sort-Object | Select-Object -Last 1
          $version = if ($null -eq $last) { "$mm.$($base[3].Value)" } else { "$mm.$($last + 1)" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

  # The rendezvous/relay server, for Linux (x86_64). Built on the oldest
  # supported Ubuntu so the binary runs on any current distribution.
  server:
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set version
        if: env.RELEASE == 'true'
        run: sed -i "0,/^version = \"[^\"]*\"/s//version = \"$VERSION\"/" Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p rider-core -p rider-server --all-targets -- -D warnings
      - run: cargo test -p rider-core -p rider-server
      - run: cargo build --release -p rider-server
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/rider-server dist/rider-server-$VERSION-linux-x86_64
          strip dist/rider-server-$VERSION-linux-x86_64
          ./dist/rider-server-$VERSION-linux-x86_64 --version
      - uses: actions/upload-artifact@v7
        with:
          name: rider-server-linux
          path: dist/
          retention-days: 7

  # macOS app (control other computers from a Mac; docs/MACOS.md): checked on
  # every push; on main the .dmg is added to the release the Windows job made.
  # Does not hold back the Windows release.
  macos:
    needs: [version, build]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # upload to the release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set version
        if: env.RELEASE == 'true'
        # The first `version = ` line (BSD sed has no GNU `0,/re/` ranges).
        run: perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p rider-core -p rider-server -p rider-media -p rider-client -p rider-app --all-targets -- -D warnings
      - run: cargo test -p rider-core -p rider-server -p rider-media -p rider-client -p rider-app
      # Packaged on every push (so a branch proves it builds); uploaded from main.
      - name: Package
        id: pkg
        run: |
          dmg=$(packaging/macos/build.sh "$VERSION" | tail -1)
          echo "file=$dmg" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: ${{ steps.pkg.outputs.file }}
          retention-days: 7
      - name: Upload to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" "${{ steps.pkg.outputs.file }}" --repo "$GITHUB_REPOSITORY" --clobber

  # Debian/Ubuntu app (x86_64), built on the oldest supported Ubuntu. Same
  # arrangement as macOS.
  linux:
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set version
        if: env.RELEASE == 'true'
        run: sed -i "0,/^version = \"[^\"]*\"/s//version = \"$VERSION\"/" Cargo.toml
      - run: sudo apt-get update -q && sudo apt-get install -y -q nasm libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p rider-media -p rider-client -p rider-app --all-targets -- -D warnings
      - run: cargo test -p rider-media -p rider-client -p rider-app
      - name: Package
        id: pkg
        run: |
          deb=$(packaging/linux/build-deb.sh "$VERSION" | tail -1)
          dpkg-deb --info "$deb"
          echo "file=$deb" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: ${{ steps.pkg.outputs.file }}
          retention-days: 7
      - name: Upload to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" "${{ steps.pkg.outputs.file }}" --repo "$GITHUB_REPOSITORY" --clobber

  # SHA256SUMS over every file of the release (the Windows job wrote it
  # before the macOS and Linux packages existed).
  checksums:
    needs: [version, build, macos, linux]
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          mkdir assets && cd assets
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*' --skip-existing
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "v$VERSION" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  build:
    needs: [version, server]
    runs-on: windows-latest
    permissions:
      contents: write # tags and releases
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        if: env.RELEASE == 'true'
        shell: pwsh
        run: (Get-Content Cargo.toml) -replace '^version = "[^"]+"', "version = `"$env:VERSION`"" | Set-Content Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

      - name: Installer
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          ./packaging/windows/build.ps1 -Version $env:VERSION

      - uses: actions/download-artifact@v8
        if: env.RELEASE == 'true'
        with:
          name: rider-server-linux
          path: dist

      - name: Publish release
        if: env.RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "target/installer/rdr-setup-$env:VERSION.exe"
          $server = "dist/rider-server-$env:VERSION-linux-x86_64"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $shash = (Get-FileHash $server -Algorithm SHA256).Hash.ToLower()
          # sha256sum format, checked by deploy/get.sh (the one-line server install).
          "$hash  rdr-setup-$env:VERSION.exe`n$shash  rider-server-$env:VERSION-linux-x86_64`n" | Set-Content -NoNewline -Encoding ascii dist/SHA256SUMS
          $notes = "**Windows 10/11 (64-bit):** download **rdr-setup-$env:VERSION.exe** below and run it. SHA-256: ``$hash```n`n" +
            "**macOS 11+ (Apple Silicon and Intel):** **RemoteDesktopRider-$env:VERSION-macos.dmg**: open it and drag the app to Applications. It is not signed with an Apple Developer ID: the first time, open it from System Settings > Privacy & Security > Open Anyway.`n`n" +
            "**Debian 12+ / Ubuntu 22.04+ (x86_64):** **remote-desktop-rider_$($env:VERSION)_amd64.deb**: ``sudo apt install ./remote-desktop-rider_$($env:VERSION)_amd64.deb```n`n" +
            "macOS and Linux control other computers; being controlled is Windows-only for now. The macOS and Linux files are added a few minutes after this release appears.`n`n" +
            "**Server (Linux x86_64):** **rider-server-$env:VERSION-linux-x86_64**, SHA-256: ``$shash``. Checksums of every file: **SHA256SUMS**."
          # Tag first: a refused tag push says why (a bare API 403 does not).
          git tag "v$env:VERSION" $env:GITHUB_SHA
          git push origin "v$env:VERSION" 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "cannot push tag v$env:VERSION" }
          gh release create "v$env:VERSION" $setup $server dist/SHA256SUMS --verify-tag --title "Remote Desktop Rider $env:VERSION" --notes "$notes" --generate-notes --latest
